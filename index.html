<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Reliable intelligence</title>
<style>
:root{--bg:#f6f8fa;--card:#fff;--text:#1f2328;--muted:#656d76;--border:#d0d7de;--primary:#1f883d;--phover:#1a7f37;--danger:#cf222e;--input:#fff;--sec:#f6f8fa;--link:#0969da}
[data-theme="dark"]{--bg:#0d1117;--card:#161b22;--text:#c9d1d9;--muted:#8b949e;--border:#30363d;--primary:#238636;--phover:#2ea043;--danger:#da3633;--input:#0d1117;--sec:#21262d;--link:#58a6ff}
*{box-sizing:border-box;transition:background .2s,color .2s;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:15px;margin:0;display:flex;flex-direction:column;align-items:center;min-height:100vh}
.container{width:100%;max-width:420px;margin-top:5vh}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.brand{font-size:17px;font-weight:700;white-space:nowrap}
.tools{display:flex;gap:8px;align-items:center}
select{padding:6px;border-radius:6px;border:1px solid var(--border);background:var(--sec);color:var(--text);font-size:13px;outline:none;max-width:90px}
.icon{background:var(--sec);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:6px;font-size:13px;cursor:pointer}
.icon:active{background:var(--border)}
.card{background:var(--card);padding:24px;border-radius:8px;border:1px solid var(--border);box-shadow:0 4px 12px rgba(0,0,0,.05)}
h2{margin:0 0 6px;font-size:20px;font-weight:600;text-align:center}
.sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:20px;min-height:38px}
input[type="email"],input[type="password"]{width:100%;padding:12px;margin-bottom:16px;background:var(--input);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:15px;outline:none}
input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(31,136,61,.15)}
.btn{width:100%;padding:12px;background:var(--primary);color:#fff;border:none;border-radius:6px;font-size:15px;font-weight:600;cursor:pointer}
.btn:active{background:var(--phover)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.links{display:flex;justify-content:space-between;margin-top:16px}
.link{background:none;border:none;color:var(--link);font-size:13px;padding:5px 0;cursor:pointer}
.agree{display:flex;align-items:flex-start;gap:8px;margin-top:16px;font-size:13px;color:var(--muted);line-height:1.5}
.agree input{margin-top:3px;width:16px;height:16px}
.agree button{background:none;border:none;color:var(--link);padding:0;font-size:13px}
#msg,#fmsg{text-align:center;margin-top:12px;font-size:13px;min-height:18px}
.msg-err{color:var(--danger)}.msg-suc{color:var(--primary)}.msg-info{color:var(--muted)}
.hidden{display:none!important}
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-120%);background:var(--danger);color:#fff;padding:10px 24px;border-radius:6px;font-size:14px;opacity:0;transition:all .3s;z-index:999;max-width:90%;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>
<body>

<div id="toast"></div>

<div class="container">
<div class="top">
<div class="brand">Reliable intelligence</div>
<div class="tools">
<button type="button" class="icon" onclick="speak()">语音</button>
<select id="lang" onchange="setLang(this.value)"><option value="zh">中文</option><option value="en">English</option><option value="ja">日本語</option><option value="de">Deutsch</option></select>
<button type="button" class="icon" onclick="theme()">主题</button>
</div>
</div>

<div id="auth" class="card">
<h2 id="title" data-i18n="title">登录系统</h2>
<div class="sub" id="sub" data-i18n="sub">欢迎回来，请输入您的账户信息</div>
<input type="email" id="email" placeholder="邮箱地址" data-i18n-ph="ph_email">
<input type="password" id="pass" placeholder="密码" data-i18n-ph="ph_pass">
<button type="button" class="btn" id="btn" onclick="auth()" data-i18n="btn">登 录</button>
<div class="links">
<button type="button" class="link" id="switch" onclick="toggleMode()" data-i18n="switch">没有账号？去注册</button>
<button type="button" class="link" id="forgot" onclick="showForgot()" data-i18n="forgot">忘记密码？</button>
</div>
<div class="agree hidden" id="agreeBox">
<input type="checkbox" id="chk">
<div>
<span data-i18n="ag1">我已阅读并同意</span>
<button type="button" onclick="showModal(T[cur].disclaimer)" data-i18n="disclaimer">《免责声明》</button>
<span data-i18n="ag2">与</span>
<button type="button" onclick="showModal(T[cur].privacy)" data-i18n="privacy">《隐私政策》</button>
<span data-i18n="ag3">。本系统仅供娱乐与学习交流使用。</span>
</div>
</div>
<div id="msg"></div>
</div>

<div id="resetSec" class="card hidden">
<h2 data-i18n="rtitle2">找回密码</h2>
<div class="sub" data-i18n="rsub2">输入您注册时的邮箱，我们将发送重置链接</div>
<input type="email" id="remail" placeholder="邮箱地址" data-i18n-ph="ph_email">
<button type="button" class="btn" id="rbtn" onclick="sendReset()" data-i18n="send">发送重置邮件</button>
<div class="links" style="justify-content:center"><button type="button" class="link" onclick="back()" data-i18n="back">返回登录</button></div>
<div id="fmsg"></div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const T={
zh:{title:"登录系统",sub:"欢迎回来，请输入您的账户信息",rtitle:"注册账号",rsub:"创建您的专属账户",ph_email:"邮箱地址",ph_pass:"密码",btn:"登 录",rbtn:"注 册",switch:"没有账号？去注册",slogin:"已有账号？去登录",forgot:"忘记密码？",rtitle2:"找回密码",rsub2:"输入您注册时的邮箱，我们将发送重置链接",send:"发送重置邮件",back:"返回登录",ag1:"我已阅读并同意",ag2:"与",ag3:"。本系统仅供娱乐与学习交流使用。",disclaimer:"【免责声明】仅供技术演示与娱乐。\n\n本系统仅为技术演示用途，不涉及真实数据存储。请勿使用真实敏感信息。",privacy:"【隐私政策】仅收集邮箱用于登录。\n\n我们不会主动收集、存储或分享您的任何个人信息。",e_empty:"请输入邮箱和密码",e_email:"邮箱格式不正确",e_pass:"密码至少6位",e_agree:"请勾选同意免责声明",p_ing:"处理中...",s_login:"登录成功！",s_reg:"注册成功，请去邮箱验证。",s_sent:"重置链接已发送",load_err:"网络组件加载失败，请检查网络连接"},
en:{title:"Sign In",sub:"Welcome back",rtitle:"Sign Up",rsub:"Create account",ph_email:"Email",ph_pass:"Password",btn:"Sign In",rbtn:"Sign Up",switch:"No account? Sign up",slogin:"Have account? Sign in",forgot:"Forgot password?",rtitle2:"Reset Password",rsub2:"Enter email for reset link",send:"Send Reset Email",back:"Back",ag1:"I agree to the",ag2:"and",ag3:".",disclaimer:"Disclaimer: Demo only.\n\nThis system is for technical demonstration purposes only. Do not use real sensitive data.",privacy:"Privacy: Email only.\n\nWe do not actively collect, store, or share your personal information.",e_empty:"Enter email & password",e_email:"Invalid email",e_pass:"Password >= 6 chars",e_agree:"Agree to terms",p_ing:"Processing...",s_login:"Success!",s_reg:"Registered! Check email.",s_sent:"Reset link sent",load_err:"Network component failed to load"},
ja:{title:"ログイン",sub:"おかえりなさい",rtitle:"新規登録",rsub:"アカウント作成",ph_email:"メール",ph_pass:"パスワード",btn:"ログイン",rbtn:"登録",switch:"アカウントなし？登録",slogin:"アカウントあり？ログイン",forgot:"パスワード忘れ？",rtitle2:"パスワード再設定",rsub2:"メールを入力",send:"メール送信",back:"戻る",ag1:"同意する",ag2:"と",ag3:"。",disclaimer:"免責事項",privacy:"プライバシー",e_empty:"入力してください",e_email:"無効なメール",e_pass:"6文字以上",e_agree:"同意が必要",p_ing:"処理中...",s_login:"成功！",s_reg:"登録完了",s_sent:"送信しました",load_err:"ネットワークエラー"},
de:{title:"Anmelden",sub:"Willkommen",rtitle:"Registrieren",rsub:"Konto erstellen",ph_email:"E-Mail",ph_pass:"Passwort",btn:"Anmelden",rbtn:"Registrieren",switch:"Kein Konto? Registrieren",slogin:"Konto? Anmelden",forgot:"Passwort vergessen?",rtitle2:"Passwort zurücksetzen",rsub2:"E-Mail eingeben",send:"E-Mail senden",back:"Zurück",ag1:"Ich stimme",ag2:"und",ag3:" zu.",disclaimer:"Haftungsausschluss",privacy:"Datenschutz",e_empty:"Eingeben",e_email:"Ungültige E-Mail",e_pass:"Mindestens 6 Zeichen",e_agree:"Zustimmen",p_ing:"Verarbeitung...",s_login:"Erfolg!",s_reg:"Registriert",s_sent:"Link gesendet",load_err:"Netzwerkfehler"}
};

let cur=localStorage.getItem('lang')||'zh',isLogin=true,supa=null;

try{
  if(window.supabase)
    supa=window.supabase.createClient(
      'https://scgmqocuqvqvyjfiulhs.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNjZ21xb2N1cXZxdnlqZml1bGhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM0MjI4MTksImV4cCI6MjEwODk5ODgxOX0.ICnjyfyYOgU840L_inw3nDiXjH6of3gk6-6V2ETNypo'
    );
}catch(e){}

const $=id=>document.getElementById(id);

function speak(){if('speechSynthesis' in window){const m={zh:'zh-CN',en:'en-US',ja:'ja-JP',de:'de-DE'};const txt=(isLogin?T[cur].title:T[cur].rtitle)+" Reliable intelligence";const u=new SpeechSynthesisUtterance(txt);u.lang=m[cur];window.speechSynthesis.speak(u)}}

function theme(){
  const n=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';
  document.documentElement.setAttribute('data-theme',n);
  localStorage.setItem('theme',n);
}

function setLang(l){
  cur=l;localStorage.setItem('lang',l);
  const d=T[l];
  document.querySelectorAll('[data-i18n]').forEach(e=>{
    const k=e.getAttribute('data-i18n');if(d[k])e.textContent=d[k];
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(e=>{
    const k=e.getAttribute('data-i18n-ph');if(d[k])e.placeholder=d[k];
  });
  updUI();
}

function updUI(){
  const d=T[cur];
  $('title').textContent=isLogin?d.title:d.rtitle;
  $('sub').textContent=isLogin?d.sub:d.rsub;
  $('btn').textContent=isLogin?d.btn:d.rbtn;
  $('switch').textContent=isLogin?d.switch:d.slogin;
}

function toggleMode(){
  isLogin=!isLogin;
  $('forgot').style.display=isLogin?'block':'none';
  $('agreeBox').classList.toggle('hidden',isLogin);
  $('pass').value='';
  $('msg').textContent='';
  updUI();
}

function showToast(msg){
  const t=$('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}

function showModal(content){
  const overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center';
  const box=document.createElement('div');
  box.style.cssText='background:var(--card);color:var(--text);padding:24px;border-radius:8px;max-width:90%;max-height:80vh;overflow:auto;font-size:14px;line-height:1.6';
  box.innerHTML='<pre style="margin:0 0 16px 0;white-space:pre-wrap;font-family:inherit">'+content+'</pre><button style="padding:8px 20px;background:var(--primary);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:14px">OK</button>';
  box.querySelector('button').onclick=()=>overlay.remove();
  overlay.onclick=(e)=>{if(e.target===overlay)overlay.remove()};
  document.body.appendChild(overlay);
}

function setMsg(id,txt,type){
  const e=$(id);
  e.textContent=txt;
  e.className='msg-'+type;
}

async function auth(){
  const email=$('email').value.trim(),pass=$('pass').value,d=T[cur],btn=$('btn');
  if(!email||!pass)return setMsg('msg',d.e_empty,'err');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return setMsg('msg',d.e_email,'err');
  if(pass.length<6)return setMsg('msg',d.e_pass,'err');
  if(!isLogin&&!$('chk').checked)return setMsg('msg',d.e_agree,'err');
  if(!supa)return setMsg('msg',d.load_err,'err');
  btn.disabled=true;setMsg('msg',d.p_ing,'info');
  try{
    if(isLogin){
      const{error}=await supa.auth.signInWithPassword({email,password:pass});
      if(error)setMsg('msg',error.message,'err');
      else{
        setMsg('msg',d.s_login,'suc');
        setTimeout(()=>showToast(d.s_login),800);
      }
    }else{
      const{error}=await supa.auth.signUp({email,password:pass});
      if(error)setMsg('msg',error.message,'err');
      else setMsg('msg',d.s_reg,'suc');
    }
  }finally{btn.disabled=false}
}

function showForgot(){
  $('auth').classList.add('hidden');
  $('resetSec').classList.remove('hidden');
  $('remail').value=$('email').value.trim();
  $('fmsg').textContent='';
}

function back(){
  $('resetSec').classList.add('hidden');
  $('auth').classList.remove('hidden');
  $('remail').value='';
  $('fmsg').textContent='';
}

async function sendReset(){
  const email=$('remail').value.trim(),d=T[cur],btn=$('rbtn');
  if(!email)return setMsg('fmsg',d.e_empty,'err');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return setMsg('fmsg',d.e_email,'err');
  if(!supa)return setMsg('fmsg',d.load_err,'err');
  btn.disabled=true;setMsg('fmsg',d.p_ing,'info');
  try{
    const{error}=await supa.auth.resetPasswordForEmail(email,{redirectTo:window.location.href.split('#')[0]});
    if(error)setMsg('fmsg',error.message,'err');
    else setMsg('fmsg',d.s_sent,'suc');
  }finally{btn.disabled=false}
}

document.addEventListener('DOMContentLoaded',()=>{
  document.documentElement.setAttribute('data-theme',localStorage.getItem('theme')||'light');
  document.getElementById('lang').value=cur;setLang(cur);
  if(!supa){
    setTimeout(()=>showToast(T[cur].load_err),500);
  }
});
</script>
</body>
</html>
