<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reliable intelligence</title><style>:root{--bg:#f6f8fa;--card:#fff;--text:#1f2328;--muted:#656d76;--border:#d0d7de;--primary:#1f883d;--phover:#1a7f37;--danger:#cf222e;--input:#fff;--sec:#f6f8fa;--link:#0969da}[data-theme="dark"]{--bg:#0d1117;--card:#161b22;--text:#c9d1d9;--muted:#8b949e;--border:#30363d;--primary:#238636;--phover:#2ea043;--danger:#da3633;--input:#0d1117;--sec:#21262d;--link:#58a6ff}*{box-sizing:border-box;transition:background .2s,color .2s;-webkit-tap-highlight-color:transparent}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:15px;margin:0;display:flex;flex-direction:column;align-items:center;min-height:100vh}.container{width:100%;max-width:420px;margin-top:5vh}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.brand{font-size:17px;font-weight:700;white-space:nowrap}.tools{display:flex;gap:8px;align-items:center}select{padding:6px;border-radius:6px;border:1px solid var(--border);background:var(--sec);color:var(--text);font-size:13px;outline:none;max-width:90px}.icon{background:var(--sec);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:6px;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}.icon:active{background:var(--border)}.card{background:var(--card);padding:24px;border-radius:8px;border:1px solid var(--border);box-shadow:0 4px 12px rgba(0,0,0,.05)}h2{margin:0 0 6px;font-size:20px;font-weight:600;text-align:center}.sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:20px;min-height:38px}.field-label{display:block;margin-bottom:6px;color:var(--muted);font-size:13px}input[type="email"],input[type="password"]{width:100%;padding:12px;margin-bottom:16px;background:var(--input);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:15px;outline:none}input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(31,136,61,.15)}.btn{width:100%;padding:12px;background:var(--primary);color:#fff;border:none;border-radius:6px;font-size:15px;font-weight:600;cursor:pointer}.btn:active{background:var(--phover)}.btn:disabled{opacity:.6;cursor:not-allowed}.links{display:flex;justify-content:space-between;margin-top:16px}.link{background:none;border:none;color:var(--link);font-size:13px;padding:5px 0;cursor:pointer}.guest-row{text-align:center;margin-top:16px;padding-top:16px;border-top:1px dashed var(--border)}.guest-btn{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;text-decoration:underline}.agree{display:flex;align-items:flex-start;gap:8px;margin-top:16px;font-size:13px;color:var(--muted);line-height:1.5}.agree input{margin-top:3px;width:16px;height:16px}.agree button{background:none;border:none;color:var(--link);padding:0;font-size:13px;cursor:pointer}#msg,#fmsg,#umsg{text-align:center;margin-top:12px;font-size:13px;min-height:18px}.msg-err{color:var(--danger)}.msg-suc{color:var(--primary)}.msg-info{color:var(--muted)}.hidden{display:none!important}#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-120%);background:var(--danger);color:#fff;padding:10px 24px;border-radius:6px;font-size:14px;opacity:0;transition:all .3s;z-index:999;max-width:90%;text-align:center}#toast.show{transform:translateX(-50%) translateY(0);opacity:1}</style></head><body><div id="toast"></div><div class="container"><div class="top"><div class="brand">Reliable intelligence</div><div class="tools"><select id="lang" onchange="setLang(this.value)" aria-label="Language"><option value="zh">中文</option><option value="en">English</option><option value="ja">日本語</option><option value="de">Deutsch</option></select><button type="button" class="icon" id="themeBtn" onclick="theme()" title="切换主题">🌙</button></div></div><div id="auth" class="card"><h2 id="title" data-i18n="title">登录系统</h2><div class="sub" id="sub" data-i18n="sub">欢迎回来，请输入您的账户信息</div><label class="field-label" for="email" data-i18n="ph_email">邮箱地址</label><input type="email" id="email" placeholder="邮箱地址" data-i18n-ph="ph_email" autocomplete="email"><label class="field-label" for="pass" data-i18n="ph_pass">密码</label><input type="password" id="pass" placeholder="密码" data-i18n-ph="ph_pass" autocomplete="current-password"><button type="button" class="btn" id="btn" onclick="auth()" data-i18n="btn">登 录</button><div class="links"><button type="button" class="link" id="switch" onclick="toggleMode()" data-i18n="switch">没有账号？去注册</button><button type="button" class="link" id="forgot" onclick="showForgot()" data-i18n="forgot">忘记密码？</button></div><div class="guest-row"><button type="button" class="guest-btn" onclick="guestLogin()" data-i18n="guest">访客直接登录</button></div><div class="agree hidden" id="agreeBox"><input type="checkbox" id="chk"><div><span data-i18n="ag1">我已阅读并同意</span><button type="button" onclick="showModal('disclaimer')" data-i18n="disclaimer">《免责声明》</button><span data-i18n="ag2">与</span><button type="button" onclick="showModal('privacy')" data-i18n="privacy">《隐私政策》</button><span data-i18n="ag3">。本系统仅供娱乐与学习交流使用。</span></div></div><div id="msg"></div></div><div id="resetSec" class="card hidden"><h2 data-i18n="rtitle2">找回密码</h2><div class="sub" data-i18n="rsub2">输入您注册时的邮箱，我们将发送重置链接</div><label class="field-label" for="remail" data-i18n="ph_email">邮箱地址</label><input type="email" id="remail" placeholder="邮箱地址" data-i18n-ph="ph_email" autocomplete="email"><button type="button" class="btn" id="rbtn" onclick="sendReset()" data-i18n="send">发送重置邮件</button><div class="links" style="justify-content:center"><button type="button" class="link" onclick="back()" data-i18n="back">返回登录</button></div><div id="fmsg"></div></div><div id="updateSec" class="card hidden"><h2 data-i18n="utitle">设置新密码</h2><div class="sub" data-i18n="usub">请输入新的账户密码</div><label class="field-label" for="newPass" data-i18n="newpass">新密码</label><input type="password" id="newPass" placeholder="新密码" data-i18n-ph="newpass" autocomplete="new-password"><label class="field-label" for="confirmPass" data-i18n="confirmpass">确认密码</label><input type="password" id="confirmPass" placeholder="确认密码" data-i18n-ph="confirmpass" autocomplete="new-password"><button type="button" class="btn" id="ubtn" onclick="updatePassword()" data-i18n="update">更新密码</button><div id="umsg"></div></div></div><script src="https://unpkg.com/@supabase/supabase-js@2.49.1"></script><script>const T={zh:{title:"登录系统",sub:"欢迎回来，请输入您的账户信息",rtitle:"注册账号",rsub:"创建您的专属账户",ph_email:"邮箱地址",ph_pass:"密码",btn:"登 录",rbtn:"注 册",switch:"没有账号？去注册",slogin:"已有账号？去登录",forgot:"忘记密码？",guest:"访客直接登录",guest_suc:"访客登录成功！",rtitle2:"找回密码",rsub2:"输入您注册时的邮箱，我们将发送重置链接",send:"发送重置邮件",back:"返回登录",utitle:"设置新密码",usub:"请输入新的账户密码",newpass:"新密码",confirmpass:"确认密码",update:"更新密码",ag1:"我已阅读并同意",ag2:"与",ag3:"。本系统仅供娱乐与学习交流使用。",disclaimer:"《免责声明》",privacy:"《隐私政策》",disclaimerText:"免责声明：本系统仅供技术演示、娱乐和学习交流使用。",privacyText:"隐私政策：本系统仅收集邮箱地址，用于账户登录、注册和密码重置。",e_empty:"请输入邮箱和密码",e_email:"邮箱格式不正确",e_pass:"密码至少6位",e_agree:"请勾选同意免责声明",e_confirm:"两次输入的密码不一致",p_ing:"处理中...",s_login:"登录成功！",s_reg:"注册成功，请去邮箱验证。",s_sent:"重置链接已发送",s_updated:"密码更新成功，请重新登录。",load_err:"网络组件加载失败，请检查网络连接",auth_err:"邮箱或密码错误",already:"该邮箱可能已经注册"},en:{title:"Sign In",sub:"Welcome back",rtitle:"Sign Up",rsub:"Create account",ph_email:"Email",ph_pass:"Password",btn:"Sign In",rbtn:"Sign Up",switch:"No account? Sign up",slogin:"Have account? Sign in",forgot:"Forgot password?",guest:"Login as Guest",guest_suc:"Guest login successful!",rtitle2:"Reset Password",rsub2:"Enter email for reset link",send:"Send Reset Email",back:"Back",utitle:"Set New Password",usub:"Enter your new password",newpass:"New password",confirmpass:"Confirm password",update:"Update Password",ag1:"I agree to the",ag2:"and",ag3:".",disclaimer:"Disclaimer",privacy:"Privacy Policy",disclaimerText:"Disclaimer: This system is for demonstration, entertainment and learning only.",privacyText:"Privacy Policy: Only email addresses are collected for authentication and password reset.",e_empty:"Enter email and password",e_email:"Invalid email",e_pass:"Password must be at least 6 characters",e_agree:"Please agree to the disclaimer",e_confirm:"Passwords do not match",p_ing:"Processing...",s_login:"Login successful!",s_reg:"Registered! Check your email.",s_sent:"Reset link sent",s_updated:"Password updated. Please sign in again.",load_err:"Network component failed to load",auth_err:"Invalid email or password",already:"This email may already be registered"},ja:{title:"ログイン",sub:"おかえりなさい",rtitle:"新規登録",rsub:"アカウント作成",ph_email:"メール",ph_pass:"パスワード",btn:"ログイン",rbtn:"登録",switch:"アカウントなし？登録",slogin:"アカウントあり？ログイン",forgot:"パスワード忘れ？",guest:"ゲストとしてログイン",guest_suc:"ゲストログイン成功！",rtitle2:"パスワード再設定",rsub2:"メールを入力",send:"メール送信",back:"戻る",utitle:"新しいパスワード",usub:"新しいパスワードを入力",newpass:"新しいパスワード",confirmpass:"パスワード確認",update:"更新",ag1:"同意する",ag2:"と",ag3:"。",disclaimer:"免責事項",privacy:"プライバシー",disclaimerText:"免責事項：本システムはデモと学習目的です。",privacyText:"プライバシー：認証とパスワード再設定のためメールのみ収集します。",e_empty:"入力してください",e_email:"無効なメール",e_pass:"6文字以上必要です",e_agree:"同意が必要です",e_confirm:"パスワードが一致しません",p_ing:"処理中...",s_login:"ログイン成功！",s_reg:"登録完了。メールを確認してください。",s_sent:"送信しました",s_updated:"パスワードを更新しました。",load_err:"ネットワークエラー",auth_err:"メールまたはパスワードが正しくありません",already:"このメールは登録済みの可能性があります"},de:{title:"Anmelden",sub:"Willkommen",rtitle:"Registrieren",rsub:"Konto erstellen",ph_email:"E-Mail",ph_pass:"Passwort",btn:"Anmelden",rbtn:"Registrieren",switch:"Kein Konto? Registrieren",slogin:"Konto vorhanden? Anmelden",forgot:"Passwort vergessen?",guest:"Als Gast anmelden",guest_suc:"Gast-Anmeldung erfolgreich!",rtitle2:"Passwort zurücksetzen",rsub2:"E-Mail eingeben",send:"E-Mail senden",back:"Zurück",utitle:"Neues Passwort",usub:"Neues Passwort eingeben",newpass:"Neues Passwort",confirmpass:"Passwort bestätigen",update:"Passwort aktualisieren",ag1:"Ich stimme",ag2:"und",ag3:" zu.",disclaimer:"Haftungsausschluss",privacy:"Datenschutz",disclaimerText:"Haftungsausschluss: Nur für Demo, Unterhaltung und Lernzwecke.",privacyText:"Datenschutz: Für Authentifizierung und Passwortzurücksetzung wird nur die E-Mail gespeichert.",e_empty:"E-Mail und Passwort eingeben",e_email:"Ungültige E-Mail",e_pass:"Mindestens 6 Zeichen",e_agree:"Bitte zustimmen",e_confirm:"Passwörter stimmen nicht überein",p_ing:"Verarbeitung...",s_login:"Erfolgreich angemeldet!",s_reg:"Registriert. E-Mail prüfen.",s_sent:"Link gesendet",s_updated:"Passwort aktualisiert.",load_err:"Netzwerkfehler",auth_err:"E-Mail oder Passwort falsch",already:"Diese E-Mail ist möglicherweise bereits registriert"}};let savedLang=localStorage.getItem("lang");let cur=T[savedLang]?savedLang:"zh";let isLogin=true;let supa=null;const SUPABASE_URL="https://scgmqocuqvqvyjfiulhs.supabase.co";const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNjZ21xb2N1cXZxdnlqZml1bGhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM0MjI4MTksImV4cCI6MjEwODk5ODgxOX0.ICnjyfyYOgU840L_inw3nDiXjH6of3gk6-6V2ETNypo";const $=id=>document.getElementById(id);function init(){const currentTheme=localStorage.getItem("theme")||"light";document.documentElement.setAttribute("data-theme",currentTheme);$("themeBtn").textContent=currentTheme==="light"?"🌙":"☀️";$("lang").value=cur;setLang(cur);try{if(window.supabase){supa=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);supa.auth.onAuthStateChange((event)=>{if(event==="PASSWORD_RECOVERY"){showUpdatePassword()}});}}catch(error){console.error(error)}if(!supa){showToast(T[cur].load_err)}}
window.addEventListener("load",init);function theme(){const next=document.documentElement.getAttribute("data-theme")==="light"?"dark":"light";document.documentElement.setAttribute("data-theme",next);localStorage.setItem("theme",next);$("themeBtn").textContent=next==="light"?"🌙":"☀️"}function setLang(language){if(!T[language])language="zh";cur=language;localStorage.setItem("lang",language);const dictionary=T[cur];document.querySelectorAll("[data-i18n]").forEach(element=>{const key=element.dataset.i18n;if(dictionary[key]){element.textContent=dictionary[key]}});document.querySelectorAll("[data-i18n-ph]").forEach(element=>{const key=element.dataset.i18nPh;if(dictionary[key]){element.placeholder=dictionary[key]}});updateUI()}function updateUI(){const dictionary=T[cur];$("title").textContent=isLogin?dictionary.title:dictionary.rtitle;$("sub").textContent=isLogin?dictionary.sub:dictionary.rsub;$("btn").textContent=isLogin?dictionary.btn:dictionary.rbtn;$("switch").textContent=isLogin?dictionary.switch:dictionary.slogin;$("forgot").style.display=isLogin?"block":"none"}function toggleMode(){isLogin=!isLogin;$("pass").value="";$("chk").checked=false;$("msg").textContent="";$("agreeBox").classList.toggle("hidden",isLogin);updateUI()}function showToast(message){const toast=$("toast");toast.textContent=message;toast.classList.add("show");window.clearTimeout(showToast.timer);showToast.timer=window.setTimeout(()=>{toast.classList.remove("show")},3000)}function showModal(type){const dictionary=T[cur];const content=type==="privacy"?dictionary.privacyText:dictionary.disclaimerText;const overlay=document.createElement("div");overlay.style.cssText=`position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center;`;const box=document.createElement("div");box.style.cssText=`background:var(--card);color:var(--text);padding:24px;border-radius:8px;max-width:90%;max-height:80vh;overflow:auto;font-size:14px;line-height:1.6;`;const text=document.createElement("div");text.textContent=content;text.style.marginBottom="16px";const closeButton=document.createElement("button");closeButton.textContent="OK";closeButton.style.cssText=`padding:8px 20px;background:var(--primary);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:14px;`;closeButton.onclick=()=>overlay.remove();box.appendChild(text);box.appendChild(closeButton);overlay.appendChild(box);overlay.onclick=event=>{if(event.target===overlay){overlay.remove()}};document.body.appendChild(overlay)}function setMsg(id,text,type){const element=$(id);element.textContent=text;element.className="msg-"+type}function isValidEmail(email){return/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)}function getAuthError(error){const dictionary=T[cur];const code=error&&error.code?error.code:"";if(code==="invalid_credentials"||code==="invalid_grant"){return dictionary.auth_err}if(code==="user_already_exists"||code==="user_already_registered"){return dictionary.already}return error?.message||dictionary.load_err}
async function auth(){const email=$("email").value.trim();const password=$("pass").value;const dictionary=T[cur];const button=$("btn");if(!email||!password){setMsg("msg",dictionary.e_empty,"err");return}if(!isValidEmail(email)){setMsg("msg",dictionary.e_email,"err");return}if(password.length<6){setMsg("msg",dictionary.e_pass,"err");return}if(!isLogin&&!$("chk").checked){setMsg("msg",dictionary.e_agree,"err");return}if(!supa){setMsg("msg",dictionary.load_err,"err");return}button.disabled=true;setMsg("msg",dictionary.p_ing,"info");try{let result;if(isLogin){result=await supa.auth.signInWithPassword({email,password})}else{result=await supa.auth.signUp({email,password})}if(result.error){setMsg("msg",getAuthError(result.error),"err");return}if(isLogin){setMsg("msg",dictionary.s_login,"suc");showToast(dictionary.s_login);}else{setMsg("msg",dictionary.s_reg,"suc")}}catch(error){console.error(error);setMsg("msg",getAuthError(error),"err")}finally{button.disabled=false}}
async function guestLogin(){const dictionary=T[cur];if(!supa){setMsg("msg",dictionary.load_err,"err");return}setMsg("msg",dictionary.p_ing,"info");try{const{data,error}=await supa.auth.signInAnonymously();if(error){setMsg("msg",error.message,"err")}else{setMsg("msg",dictionary.guest_suc,"suc");showToast(dictionary.guest_suc);}}catch(error){console.error(error);setMsg("msg",error.message,"err")}}
function showForgot(){$("auth").classList.add("hidden");$("updateSec").classList.add("hidden");$("resetSec").classList.remove("hidden");$("remail").value=$("email").value.trim();$("fmsg").textContent=""}function back(){$("resetSec").classList.add("hidden");$("updateSec").classList.add("hidden");$("auth").classList.remove("hidden");$("remail").value="";$("fmsg").textContent="";$("umsg").textContent=""}
async function sendReset(){const email=$("remail").value.trim();const dictionary=T[cur];const button=$("rbtn");if(!email){setMsg("fmsg",dictionary.e_empty,"err");return}if(!isValidEmail(email)){setMsg("fmsg",dictionary.e_email,"err");return}if(!supa){setMsg("fmsg",dictionary.load_err,"err");return}button.disabled=true;setMsg("fmsg",dictionary.p_ing,"info");try{const redirectUrl=window.location.href.split("#")[0];const{error}=await supa.auth.resetPasswordForEmail(email,{redirectTo:redirectUrl});if(error){setMsg("fmsg",getAuthError(error),"err")}else{setMsg("fmsg",dictionary.s_sent,"suc")}}catch(error){console.error(error);setMsg("fmsg",getAuthError(error),"err")}finally{button.disabled=false}}
function showUpdatePassword(){$("auth").classList.add("hidden");$("resetSec").classList.add("hidden");$("updateSec").classList.remove("hidden");$("newPass").value="";$("confirmPass").value="";$("umsg").textContent=""}
async function updatePassword(){const newPassword=$("newPass").value;const confirmPassword=$("confirmPass").value;const dictionary=T[cur];const button=$("ubtn");if(newPassword.length<6){setMsg("umsg",dictionary.e_pass,"err");return}if(newPassword!==confirmPassword){setMsg("umsg",dictionary.e_confirm,"err");return}if(!supa){setMsg("umsg",dictionary.load_err,"err");return}button.disabled=true;setMsg("umsg",dictionary.p_ing,"info");try{const{error}=await supa.auth.updateUser({password:newPassword});if(error){setMsg("umsg",getAuthError(error),"err");return}await supa.auth.signOut();setMsg("umsg",dictionary.s_updated,"suc");window.setTimeout(()=>{$("updateSec").classList.add("hidden");$("auth").classList.remove("hidden")},1200)}catch(error){console.error(error);setMsg("umsg",getAuthError(error),"err")}finally{button.disabled=false}}</script></body></html>
